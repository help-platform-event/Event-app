# Infra-only dev stack, for running the Gateway/Front on the host (`pnpm dev`).
# Auth (ms-auth-java + its MySQL/Kafka) runs from the ms-auth-java repo
# (`./mvnw spring-boot:run` or `docker compose --profile app up`).
# For the full containerised stack in one command, use ../../docker-compose.dev.yml instead.
services:
    # -------------------------
    # DB PRISMA
    # -------------------------
    db:
        image: mysql:8.0
        volumes:
            - db_data:/var/lib/mysql
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: help
        ports:
            - 3308:3306
              # portlocal:portducontainer
    phpmyadmin:
        depends_on:
            - db
        image: phpmyadmin
        restart: always
        ports:
            - "8083:80"
        environment:
            PMA_HOST: db

volumes:
    db_data:
