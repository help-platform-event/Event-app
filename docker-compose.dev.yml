# Full dev stack in one command (requires ms-auth-java cloned next to this repo):
#   docker compose -f docker-compose.dev.yml --profile app up --build
# `--profile app` is needed because ms-auth-java keeps its own `app` service behind that profile.
include:
    # ms-auth-java's MySQL (3307), Kafka (9094), Adminer (8081) and the app itself (8080).
    - ../ms-auth-java/compose.yaml

services:
    # -------------------------
    # DB PRISMA (MYSQL)
    # -------------------------
    db:
        image: mysql:8.0
        container_name: mysql-db
        volumes:
            - db_data:/var/lib/mysql
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: help
        ports:
            - "3308:3306"
        healthcheck:
            # TCP (-h 127.0.0.1), not the socket: on first start MySQL runs a temporary init
            # server without networking, which a socket ping would wrongly report as ready.
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
            interval: 5s
            timeout: 5s
            retries: 20

    phpmyadmin:
        image: phpmyadmin
        container_name: dev-phpmyadmin
        restart: always
        ports:
            - "8083:80"
        environment:
            PMA_HOST: db
        depends_on:
            - db

    # One-shot: applies the Prisma migrations, then exits. Reuses the Gateway image's `builder`
    # stage, which has the full workspace (Prisma CLI + migrations) installed.
    db-migrate:
        build:
            context: .
            dockerfile: apps/gateway/Dockerfile
            target: builder
        environment:
            DATABASE_URL: mysql://root:root@db:3306/help
        command: ["pnpm", "--filter", "@app/db", "db:deploy"]
        depends_on:
            db:
                condition: service_healthy
        restart: "no"

    # =========================================================
    # MICROSERVICES
    # =========================================================

    # -------------------------
    # GATEWAY
    # -------------------------
    gateway:
        build:
            context: .
            dockerfile: apps/gateway/Dockerfile
        container_name: dev-gateway
        ports:
            - "3000:3000"
        env_file:
            - .env
        environment:
            # Pinned here rather than read from .env, whose later entries can point at a remote DB.
            DATABASE_HOST: db
            DATABASE_PORT: 3306
            DATABASE_USER: root
            DATABASE_PASSWORD: root
            DATABASE_NAME: help
            # `app` = ms-auth-java, from the included compose file (same network).
            MS_AUTH_URL: http://app:8080
            # Must match ms-auth-java's dev JWT_SECRET (see its compose.yaml): the Gateway
            # verifies the access tokens that ms-auth-java signs.
            JWT_ACCESS_SECRET: c2FtcGxlLWRldi1vbmx5LXNlY3JldC1kby1ub3QtdXNlLWluLXByb2QtMzJieXRlcyE=
            JWTALGORITHM: HS256
        depends_on:
            db-migrate:
                condition: service_completed_successfully
            app:
                condition: service_healthy
        restart: unless-stopped

    # -------------------------
    # FRONTEND
    # -------------------------
    frontend:
        build:
            context: .
            dockerfile: apps/front/Dockerfile
            # Vite inlines these at build time (ARGs in the Dockerfile), not at runtime.
            args:
                VITE_API_URL: http://localhost:3000
                VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
                VITE_GEOAPIFY_API_KEY: ${VITE_GEOAPIFY_API_KEY:-}
        container_name: dev-frontend
        ports:
            - "5173:80"
        depends_on:
            - gateway
        restart: unless-stopped

# -------------------------
# VOLUMES
# -------------------------
volumes:
    db_data: