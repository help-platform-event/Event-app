services:
    # -------------------------
    # AUTH DB
    # -------------------------
    mongo-auth:
        image: mongo:latest
        container_name: dev-mongo-auth
        ports:
            - "27017:27017"
        volumes:
            - mongo_auth_data:/data/db

    mongo-express-auth:
        image: mongo-express:latest
        container_name: dev-mongo-express-auth
        restart: always
        ports:
            - "8084:8081"
        environment:
            ME_CONFIG_MONGODB_URL: mongodb://mongo-auth:27017
            ME_CONFIG_BASICAUTH: "false"
        depends_on:
            - mongo-auth

    # -------------------------
    # USER DB
    # -------------------------
    mongo-user:
        image: mongo:latest
        container_name: dev-mongo-user
        ports:
            - "27018:27017"
        volumes:
            - mongo_user_data:/data/db

    mongo-express-user:
        image: mongo-express:latest
        container_name: dev-mongo-express-user
        restart: always
        ports:
            - "8082:8081"
        environment:
            ME_CONFIG_MONGODB_URL: mongodb://mongo-user:27017
            ME_CONFIG_BASICAUTH: "false"
        depends_on:
            - mongo-user

    # -------------------------
    # DB PRISMA (MYSQL)
    # -------------------------
    db:
        image: mysql:8.0
        container_name: mysql-db
        volumes:
            - db_data:/var/lib/mysql
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: help
        ports:
            - "3308:3306"

    phpmyadmin:
        image: phpmyadmin
        container_name: dev-phpmyadmin
        restart: always
        ports:
            - "8083:80"
        environment:
            PMA_HOST: db
        depends_on:
            - db

    # =========================================================
    # MICROSERVICES
    # =========================================================

    # -------------------------
    # GATEWAY
    # -------------------------
    gateway:
        build:
            context: .
            dockerfile: apps/gateway/Dockerfile
        container_name: dev-gateway
        ports:
            - "3000:3000"
        env_file:
            - .env
        environment:
            # ms-auth-java runs from its own repo's compose (`docker compose --profile app up`),
            # published on the host's port 8080.
            MS_AUTH_URL: http://host.docker.internal:8080
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            - db
        restart: unless-stopped

    # -------------------------
    # MS-AUTH
    # -------------------------
    # Legacy NestJS ms-auth, replaced by ms-auth-java and no longer reachable (NATS is gone).
    # Kept behind the `legacy` profile until its removal (roadmap step 15).
    ms-auth:
        build:
            context: .
            dockerfile: services/ms-auth/Dockerfile
        container_name: dev-ms-auth
        profiles: ["legacy"]
        ports:
            - "3001:3001"
        env_file:
            - .env
        depends_on:
            - mongo-auth
        restart: unless-stopped

    # -------------------------
    # FRONTEND
    # -------------------------
    frontend:
        build:
            context: .
            dockerfile: apps/front/Dockerfile
        container_name: dev-frontend
        ports:
            - "5173:80"
        environment:
            VITE_API_URL: http://localhost:3000
        depends_on:
            - gateway
        restart: unless-stopped

# -------------------------
# VOLUMES
# -------------------------
volumes:
    mongo_auth_data:
    mongo_user_data:
    db_data: